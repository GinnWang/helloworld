name: Execute Testim smoke Test

on:
  pull_request:
    types: [opened, synchronize]  # Trigger when a PR is created or updated
    branches:
      - "**"  # Trigger for all branches
jobs:
    run-testimio-cli:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - uses: actions/setup-node@v4
              with:
                node-version: 'lts'
                # You can also change 'lts' to any supported LTS Node.js version.
            - run: npm install -g @testim/testim-cli
            - run: testim --token $TESTIMWEBTOKEN --project "c8ylu6OetLu3Ovnm7RLA" --grid "Testim-Grid" --mode "selenium" --branch "ginnExecution" --label "Demo BLC Login" --parallel 1 --timeout 1200000